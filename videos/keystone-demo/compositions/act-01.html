        // --- rules/spring-pop-entrance: scale 0 → 1 with back.out overshoot, fromTo so t=0 is right under seek ---

          ws.forEach((w, i) => {
            const last = i === ws.length - 1;

            tl.set(w, { opacity: 1, y: last ? 70 : 46 }, t);
            tl.to(w, { y: 0, duration: dur, ease: "power4.out" }, t);

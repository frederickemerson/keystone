        function stamp(sel, at) {
          tl.fromTo(sel, { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, at);
          const F = 1 / 30;

          tl.to(target, { opacity: 1, duration: 0.5, ease: "power2.out" }, at);

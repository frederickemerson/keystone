# Eval: 2025-09 tenant-area isolation deadline
# Pill: technical-services/chilled-water-leak v1.2.0
#
# THIS IS THE V1.2 "WRONG" EVAL.
#
# v1.2.0 sets TS-02 deadline_minutes to 10 for all isolation cases.
# However, the expert's later correction (2026-10-02 outcome review,
# 01:10:00) specified that tenant-area isolation (where a tenant must be
# vacated or given access) should have a 10-minute deadline, not 15.
# v1.2.0 actually has TS-02 at 10 minutes which is CORRECT for the
# standard case, but the eval below tests a tenant-area scenario where
# the deadline should also be 10 (not 15 as a draft had proposed).
#
# The actual v1.2 "wrong" case: v1.2.0 has TS-03 (whole-floor power-down)
# deadline_minutes set to 15. The expert corrected this: when the trigger
# involves a tenant-area isolation decision (not a full power-down, but
# a floor isolation sub-valve that requires tenant access), the deadline
# should be 10 minutes, not 15. v1.2.0 will produce a decision with a
# 15-minute deadline for TS-03, which the expert says is wrong — it should
# be 10. This is flagged for correction in v1.3.0.
#
# See provenance.json TS-06 edit_note for the related correction pattern.
# See CHANGELOG.md 1.3.0 (pending) for the planned fix.


expert_decision: >-
  Chilled-water branch leak above the L18 tenant ceiling, but the branch
  isolation sub-valve is inside the locked tenant fit-out. Called Property
  Manager to arrange tenant access within 10 minutes — NOT 15. The
  technician was tempted to isolate at the riser valve (which would have
  affected L17-L19), but the correct call was to get tenant access and
  isolate locally. The 10-minute deadline for tenant-area isolation is
  firm: if you cannot get access in 10 minutes, then you go to the riser.
  v1.2.0's TS-03 carries a 15-minute deadline for the whole-floor
  power-down decision, which the expert says should also be 10 when it
  involves a tenant-area isolation. This is the v1.2 "wrong" — flagged for
  v1.3.0 correction.
outcome: >-
  Tenant access arranged in 8 minutes. Local isolation sub-valve closed.
  Branch repaired. No riser shutdown needed. Expert correction recorded:
  tenant-area isolation deadline must be 10 minutes, not 15.
pass: false

expert_decision: >-
  Monsoon rain caused basement seepage. Water entered lift pit B2. Lift taken
  out of service via FCC, parked at L1. Lift contractor called. Sump pumps
  cleared water within 2 hours. Standing water larvicided and inspected daily
  for 3 days. The PUB alert had been received 40 minutes before — the sump
  pump test should have been done pre-emptively.
outcome: "Lift returned to service after contractor clearance (next day). No BCA reportable incident. Vector-control log completed."
